<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeSpace Demo</title>
    <style>
      html {
        box-sizing: border-box;
      }
      * {
        box-sizing: inherit;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #222;
      }
      #progress {
        background: url(demotitle.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        z-index: 10;
      }
      #progress_container {
        width: 70%;
        margin: 0 auto;
        position: relative;
        top: 50%;
      }
      #progress_bar_back {
        width: 100%;
        background-color: #353B4C;
        margin: 0 auto;
        padding: 3px;
      }
      #progress_bar {
        padding-left: 20px;
        line-height: 30px;
        height: 30px;
        width: 0%;
        background-color: #798199;
      }
      #progress_text, #progress_bar {
        font-family: 'Noto Sans', sans-serif;
        color: #4C442D;

      }
      canvas, #progress {
        width: 100vw;
        height: 75vw;
        background-color: #000;
        max-height: 100vh;
        max-width: 133.333333vh;
        margin: auto;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="progress">
      <div id="progress_container">
        <div id="progress_bar_back"><div id="progress_bar"></div></div>
        <div id="progress_text"></div>
      </div>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type='text/javascript'>
      var progress = document.getElementById('progress');
      var progress_bar = document.getElementById('progress_bar');
      var progress_text = document.getElementById('progress_text');

      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          if (0) { // XXX disabled for safety typeof dump == 'function') {
            dump(text + '\n'); // fast, straight to the real console
          } else {
            console.error(text);
          }
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          if (m) {
            text = m[1];
            var perc = parseInt(m[2]) / parseInt(m[4]) * 100;
            progress_bar.style.width = perc + '%';
            progress_bar.innerHTML = perc.toFixed(1) + '%';
          }
          progress_text.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
